<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arel Kair</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    (function () {
      const root = document.documentElement;
      let theme = null;
      let lang = null;
      try {
        theme = localStorage.getItem("theme");
        lang = localStorage.getItem("lang");
      } catch (error) {}
      root.dataset.theme = theme === "light" ? "light" : "dark";
      if (["en", "es", "ko", "zh"].includes(lang)) root.lang = lang;
    })();
  </script>
</head>
<body>
  <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="sidebar">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 6h18M3 12h18M3 18h18" />
    </svg>
  </button>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="index.html">Arel Kair</a>

      <nav class="sidebar-nav" aria-label="Main">
        <a class="nav-link active" href="index.html" data-i18n="navHome">Home</a>
        <a class="nav-link" href="index.html#projects" data-i18n="navProjects">Projects</a>
        <a class="nav-link" href="blog/index.html" data-i18n="navBlog">Blog</a>
      </nav>

      <div class="sidebar-footer">
        <div class="clock" id="clock" aria-hidden="true">
          <svg class="clock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3.5 2" />
          </svg>
          <span id="clockTime">--:--</span>
        </div>

        <div class="sidebar-controls">
          <div class="lang" id="lang">
            <button class="lang-btn" id="langBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Select language">
              <svg class="lang-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M3 12h18M12 3c2.6 2.6 2.6 15.4 0 18M12 3c-2.6 2.6-2.6 15.4 0 18" />
              </svg>
              <span class="lang-label" id="langLabel">English</span>
              <svg class="lang-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
            <ul class="lang-menu" id="langMenu" role="listbox" aria-label="Language">
              <li class="lang-option" role="option" data-lang="en" tabindex="-1" aria-selected="true">English</li>
              <li class="lang-option" role="option" data-lang="es" tabindex="-1" aria-selected="false">Español</li>
              <li class="lang-option" role="option" data-lang="ko" tabindex="-1" aria-selected="false">한국어</li>
              <li class="lang-option" role="option" data-lang="zh" tabindex="-1" aria-selected="false">中文</li>
            </ul>
          </div>

          <button class="control control-theme" id="themeToggle" type="button" aria-label="Toggle theme">
            <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4.2" />
              <path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8" />
            </svg>
            <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>

          <a class="control" href="https://github.com/arelkair" target="_blank" rel="noopener" aria-label="GitHub">
            <svg class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
            </svg>
          </a>
        </div>
      </div>
    </aside>

    <main class="content">
      <div class="page">
        <header class="hero">
          <h1 class="name" data-i18n="heroGreeting">Hi, I'm Arel Kair.</h1>
          <p class="tagline" data-i18n="heroTagline">I build things for the web and tinker with security, self-hosting and AI.</p>

          <ul class="chips" aria-label="Interests">
            <li class="chip">
              <svg class="chip-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2c.5 4 2.5 6 6 6.5-3.5.5-5.5 2.5-6 6.5-.5-4-2.5-6-6-6.5 3.5-.5 5.5-2.5 6-6.5z" />
              </svg>
              <span data-i18n="interestAi">AI</span>
            </li>
            <li class="chip">
              <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z" />
              </svg>
              <span data-i18n="interestSecurity">Security</span>
            </li>
            <li class="chip">
              <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="4" y="4" width="16" height="6" rx="1.5" />
                <rect x="4" y="14" width="16" height="6" rx="1.5" />
                <circle cx="7.5" cy="7" r="0.9" fill="currentColor" stroke="none" />
                <circle cx="7.5" cy="17" r="0.9" fill="currentColor" stroke="none" />
              </svg>
              <span data-i18n="interestHosting">Self-hosting</span>
            </li>
            <li class="chip">
              <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="8" width="18" height="9" rx="4" />
                <line x1="8" y1="11" x2="8" y2="14" />
                <line x1="6.5" y1="12.5" x2="9.5" y2="12.5" />
                <circle cx="16" cy="11.5" r="1" fill="currentColor" stroke="none" />
                <circle cx="18" cy="13.5" r="1" fill="currentColor" stroke="none" />
              </svg>
              <span data-i18n="interestGaming">Gaming</span>
            </li>
          </ul>
        </header>

        <section class="block" id="projects">
          <h2 class="block-title" data-i18n="projectsTitle">Projects</h2>
          <div class="tile-grid">
            <a class="tile" href="https://helloworld-arelkair.vercel.app/" target="_blank" rel="noopener" aria-label="Hello, World!">
              <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M8 6 3 12l5 6M16 6l5 6-5 6" />
              </svg>
              <span class="tile-title">Hello, World!</span>
            </a>

            <a class="tile" href="https://pool-arelkair.vercel.app/" target="_blank" rel="noopener" aria-label="Pool">
              <svg class="tile-icon" viewBox="0 0 64 64" aria-hidden="true">
                <path d="M32 2C15.432 2 2 15.432 2 32s13.432 30 30 30s30-13.432 30-30S48.568 2 32 2m13.102 32.953c-5.594 4.627-14.084 3.592-18.965-2.309c-4.881-5.902-4.303-14.436 1.291-19.063c5.594-4.625 14.084-3.592 18.965 2.311s4.302 14.436-1.291 19.061" style="fill: currentColor" />
                <path d="M40.209 20.738c.742-1.457.732-3.074-.236-4.631c-1.68-2.701-5.055-3.225-8.17-1.285c-3.143 1.953-4.164 5.209-2.484 7.912c.967 1.555 2.414 2.279 4.072 2.244c-1.109 1.818-1.152 3.803-.021 5.621c1.785 2.869 5.314 3.494 8.994 1.207c3.68-2.289 4.68-5.73 2.895-8.602c-1.132-1.815-2.929-2.655-5.05-2.466m-8.162.532c-.893-1.436-.463-3.195 1.152-4.199c1.594-.99 3.398-.588 4.275.822c.879 1.412.457 3.234-1.135 4.225c-1.614 1.005-3.398.587-4.292-.848m8.814 8.121c-1.771 1.102-3.75.674-4.717-.883c-.938-1.506-.402-3.398 1.369-4.5c1.773-1.102 3.719-.721 4.641.762c.953 1.531.479 3.517-1.293 4.621" style="fill: currentColor" />
              </svg>
              <span class="tile-title">Pool</span>
            </a>

            <a class="tile" href="https://arelkair.vercel.app/" target="_blank" rel="noopener" aria-label="Home">
              <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 12 12 5l8 7" />
                <path d="M6 11v8h5v-5h2v5h5v-8" />
              </svg>
              <span class="tile-title">Home</span>
            </a>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script defer src="js/app.js"></script>
</body>
</html>
